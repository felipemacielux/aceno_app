services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aceno
      POSTGRES_PASSWORD: aceno
      POSTGRES_DB: aceno
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://aceno:aceno@db:5432/aceno
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app

volumes:
  db_data:
